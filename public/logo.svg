<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Quartz Glass Base Gradient -->
    <radialGradient id="liquidObsidian" cx="50%" cy="30%" r="80%" fx="40%" fy="20%">
      <stop offset="0%" stop-color="#242B38"/>
      <stop offset="35%" stop-color="#161A23"/>
      <stop offset="70%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#07080B"/>
    </radialGradient>

    <!-- Liquid Amber & Terracotta Core Filament Gradient -->
    <linearGradient id="liquidFilament" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFE3C2"/>
      <stop offset="20%" stop-color="#FFA46B"/>
      <stop offset="50%" stop-color="#E27344"/>
      <stop offset="80%" stop-color="#C25727"/>
      <stop offset="100%" stop-color="#8A320F"/>
    </linearGradient>

    <!-- Prismatic Gold Chrome Rim Gradient -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FFE0B2" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Inner Refraction Bevel Gradient -->
    <linearGradient id="glassBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Top Specular Sheen Sweep Gradient -->
    <linearGradient id="specularSheen" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Molten Glow Filter -->
    <filter id="liquidGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glass Caustic Shadow -->
    <filter id="glassElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#E27344" flood-opacity="0.25"/>
    </filter>

    <!-- Clip Path for Inside the Liquid Glass Squircle -->
    <clipPath id="squircleClip">
      <rect x="20" y="20" width="472" height="472" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- External Ambient Glass Shadow -->
  <rect x="24" y="28" width="464" height="464" rx="108" ry="108" fill="#000000" opacity="0.6" filter="url(#glassElevation)"/>

  <!-- Main Body Group (Clipped to Squircle) -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Layer: Liquid Obsidian Quartz -->
    <rect x="20" y="20" width="472" height="472" fill="url(#liquidObsidian)"/>

    <!-- Ambient Caustic Pool 1: Warm Amber / Terracotta Center Glow -->
    <circle cx="280" cy="240" r="160" fill="#E27344" opacity="0.32" filter="blur(50px)"/>

    <!-- Ambient Caustic Pool 2: Prismatic Sapphire Edge -->
    <circle cx="120" cy="400" r="140" fill="#3B82F6" opacity="0.2" filter="blur(60px)"/>

    <!-- Ambient Caustic Pool 3: Radiant Gold Lens -->
    <circle cx="360" cy="140" r="110" fill="#F59E0B" opacity="0.25" filter="blur(40px)"/>

    <!-- Fine Optical Grid / Precision Scale -->
    <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
      <circle cx="256" cy="256" r="190" fill="none" stroke-dasharray="4 8"/>
      <circle cx="256" cy="256" r="130" fill="none" stroke-dasharray="2 6"/>
      <line x1="256" y1="40" x2="256" y2="70"/>
      <line x1="256" y1="442" x2="256" y2="472"/>
      <line x1="40" y1="256" x2="70" y2="256"/>
      <line x1="442" y1="256" x2="472" y2="256"/>
    </g>

    <!-- Sculpted Floating Emblem: Synthesis of 'P', Devanagari 'प', and QR Aperture -->
    <g filter="url(#liquidGlow)">
      
      <!-- Top-Left QR Positioning Corner in Liquid Amber Crystal -->
      <path d="M 124 186 L 124 140 C 124 131 131 124 140 124 L 186 124" 
            fill="none" 
            stroke="url(#liquidFilament)" 
            stroke-width="18" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <rect x="146" y="146" width="22" height="22" rx="6" fill="url(#liquidFilament)"/>

      <!-- The Core Parichay Monogram: Latin 'P' + Devanagari 'प' Arch + Aperture -->
      <!-- Left Vertical Stem (Solid anchor of identity) -->
      <path d="M 180 144 L 180 368" 
            stroke="url(#liquidFilament)" 
            stroke-width="26" 
            stroke-linecap="round"/>

      <!-- Devanagari 'प' Connecting Horizontal Swell & Flow -->
      <path d="M 180 252 C 220 252 260 256 290 236 C 324 212 334 164 290 144 C 250 126 196 144 180 144" 
            fill="none" 
            stroke="url(#liquidFilament)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Optical Camera Aperture Ring Blade Arc -->
      <path d="M 276 166 C 340 190 368 266 332 328 C 302 380 234 402 180 376" 
            fill="none" 
            stroke="url(#liquidFilament)" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-dasharray="120 18"/>

      <!-- Inner Aperture Iris Core: Glowing Floating Lens Dot -->
      <circle cx="260" cy="248" r="16" fill="url(#liquidFilament)"/>
      <circle cx="260" cy="248" r="8" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Liquid Glass 3D Convex Lens Top Specular Reflection Wave -->
    <path d="M 20 160 C 110 80 250 50 492 110 L 492 20 L 20 20 Z" 
          fill="url(#specularSheen)" 
          opacity="0.85"/>

    <!-- Diagonal Glass Caustic Refraction Glint -->
    <path d="M 70 40 C 220 80 380 180 440 380 C 410 320 350 200 190 100 Z" 
          fill="#FFFFFF" 
          opacity="0.12"/>

    <!-- Sharp White Specular Catchlight Sparkle (Upper-Right Focus) -->
    <g transform="translate(382, 118)">
      <ellipse cx="0" cy="0" rx="18" ry="4" fill="#FFFFFF" opacity="0.95" transform="rotate(-30)"/>
      <ellipse cx="0" cy="0" rx="18" ry="4" fill="#FFFFFF" opacity="0.95" transform="rotate(60)"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="12" fill="#FFE0B2" opacity="0.6" filter="blur(2px)"/>
    </g>

    <!-- Bottom Inner Specular Horizon Reflection -->
    <ellipse cx="256" cy="486" rx="180" ry="24" fill="#FFFFFF" opacity="0.08" filter="blur(6px)"/>
  </g>

  <!-- Outer Double-Rim Glass Bevel Frame (iOS Liquid Squircle Edge) -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" 
        fill="none" 
        stroke="url(#specularRim)" 
        stroke-width="3.5"/>

  <!-- Inner Hairline Optical Reflection Edge -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" 
        fill="none" 
        stroke="url(#glassBevel)" 
        stroke-width="2"/>
</svg>
